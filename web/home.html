                    <div class="d-flex align-items-center">
                        <div class="dropdown ms-3 me-3">

                                <i class="ri-global-line fs-5"></i>
                            </a>
                            <ul class="dropdown-menu dropdown-menu-end dropdown-menu-dark shadow border-1 mt-2" aria-labelledby="langDropdown" style="min-width: 120px;">
                                <li><a class="dropdown-item" href="#" onclick="translatePage('en')">English</a></li>
                                <li><a class="dropdown-item" href="#" onclick="translatePage('si')">සිංහල</a></li>
                                <li><a class="dropdown-item" href="#" onclick="translatePage('ta')">தமிழ்</a></li>

        <!--Navbar -->

        <!-- Filters Bar -->
        <div class="container my-3 mb-5 mt-5">
            <!-- Filters Bar -->
            <div class="filters-bar mb-4 d-flex flex-wrap  gap-5 mb-4 justify-content-center m-3 space-stars" style="position:relative;">
                <div>
                    <label class="fw-semibold text-secondary me-2">Category</label>
                    <select class="form-select d-inline w-auto" id="filter-category">
                        <option value="0">All</option>
                    </select>
                </div>
                <div>
                    <label class="fw-semibold text-secondary me-2">Difficulty</label>
                    <select class="form-select d-inline w-auto" id="filter-difficulty">
                        <option value="">All</option>
                        <option value="Beginner">Beginner</option>
                        <option value="Intermediate">Intermediate</option>
                        <option value="Advanced">Advanced</option>
                    </select>
                </div>
                <div>
                    <label class="fw-semibold text-secondary me-2">Price</label>
                    <select class="form-select d-inline w-auto" id="filter-price">
                        <option value="">All</option>
                        <option value="Free">Free</option>
                        <option value="Paid">Paid</option>
                    </select>
                </div>
            </div>
        </div>
        <!-- Filters Bar -->

        <!-- Popular Courses -->
        <section class="container-lg career-section">
            <div class="d-flex align-items-center mb-4 flex-wrap">

            </div>
            <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4" id="course-list">
                <!-- Cards will be rendered by JS below -->
            </div>
        </section>
        <!-- Popular Courses -->

        <!--Pagination-->
        <nav aria-label="Page navigation" class="my-4">
            <ul class="pagination justify-content-center" id="course-pagination"></ul>
        </nav>
        <!--Pagination-->

        <!--footer-->
        <div id="footer-placeholder"></div>
        <script>
            fetch('footer.html')
                    .then(res => res.text())
                    .then(data => {
                        document.getElementById('footer-placeholder').innerHTML = data;
                    });
        </script>
        <!--footer-->

        <!--cart-->
        <div id="cart-drawer-placeholder"></div>
        <script>
            fetch('cart-drawer.html')
                    .then(res => res.text())
                    .then(data => {
                        document.getElementById('cart-drawer-placeholder').innerHTML = data;
                    });
        </script>
        <!--cart-->

        <div class="toast-container position-fixed bottom-0 end-0 p-3">
            <div id="homeToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
                <div class="toast-header">
                    <img src="assets/images/logo/whiteplanet.png" class="rounded me-2" style="height: 40px; vertical-align: middle; margin-left: 2px;">
                    <strong class="me-auto">SkillVerse</strong>
                    <small>Now</small>
                    <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
                </div>
                <div class="toast-body" id="toastBody">
                    <!-- Message goes here -->
                </div>
            </div>
        </div>

        <!-- Google Translate script -->
        <div id="google_translate_element" style="display:none;"></div>
        <script type="text/javascript">
            function googleTranslateElementInit() {
                new google.translate.TranslateElement({pageLanguage: 'en', includedLanguages: 'en,si,ta', layout: google.translate.TranslateElement.InlineLayout.SIMPLE}, 'google_translate_element');
            }

            // Language change handler
            function translatePage(lang) {
                if (lang === 'en') {
                    // Reset to English
                    document.cookie = 'googtrans=/en/en;domain=' + window.location.hostname + ';path=/';
                    location.reload();
                    return;
                }
                var code = '/en/' + lang;
                document.cookie = 'googtrans=' + code + ';domain=' + window.location.hostname + ';path=/';
                location.reload();
            }
        </script>
        <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
        <script src="assets/js/sign-out.js"></script>
        <script src="assets/js/cart.js"></script>
        <script src="assets/js/home.js"></script>

        <!-- Bootstrap 5 JS Bundle -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <!-- GSAP for animation -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
