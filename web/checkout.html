<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Secure Checkout | SkillVerse</title>
        <link rel="icon" href="assets/images/logo/blackplanet.png" type="image/png">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
        <link rel="stylesheet" href="assets/css/checkout.css"/>
    </head>
    <body onload="loadCheckoutData();">
        <!--navbar-->
        <div id="navbar"></div>
        <script>
            fetch('navbar-normal.html')
                    .then(res => res.text())
                    .then(data => {
                        document.getElementById('navbar').innerHTML = data;
                    });
        </script>
        <!--navbar-->


        <div class="checkout-wrapper">
            <div class="checkout-card">
                <div class="text-center mb-4">
                    <img src="assets/images/logo/whiteplanet.png" class="checkout-logo" alt="Skillverse">
                    <div class="checkout-title">Complete Your Purchase</div>
                    <div class="trust-msg mt-2"><i class="ri-lock-2-fill secure-icon me-1"></i> 100% Secure Payment via PayHere</div>
                </div>
                <!-- Order Summary -->
                <div class="summary-card mb-4">
                    <div class="fw-bold mb-2">Order Summary</div>
                    <div id="checkout-items"></div>
                    <hr class="my-3" style="border-color:#222a38;">
                    <div class="d-flex justify-content-between align-items-center summary-total mb-1">
                        <span>Total</span>
                        <span id="checkout-total">LKR 0.00</span>
                    </div>
                </div>
                <!-- Billing Form -->
                <form id="checkoutForm">
                    <div class="mb-3">
                        <label class="form-label" for="fullName">Full Name</label>
                        <input class="form-control bg-dark text-light" id="fullName" type="text" placeholder="Your full name" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="email">Email Address</label>
                        <input class="form-control bg-dark text-light" id="email" type="email" placeholder="you@email.com" required>
                    </div>
                    <!-- Optional: add phone/address fields as PayHere supports -->
                    <button class="payhere-btn mt-3" type="submit">
                        <img src="assets/images/PayHere-Logo.png" alt="PayHere" style="height:22px;vertical-align:middle;margin-right:8px;">
                        Pay with PayHere
                    </button>
                </form>
                <div class="text-center text-muted mt-4" style="font-size:0.97em;">
                    By completing your purchase, you agree to our <a href="#" class="text-info">Terms of Service</a>.
                </div>
            </div>
        </div>

        <div class="toast-container position-fixed bottom-0 end-0 p-3">
            <div id="checkoutToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
                <div class="toast-header">
                    <img src="assets/images/logo/whiteplanet.png" class="rounded me-2" style="height: 40px; vertical-align: middle; margin-left: 2px;">
                    <strong class="me-auto">SkillVerse</strong>
                    <small>Now</small>
                    <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
                </div>
                <div class="toast-body" id="toastBody">
                    <!-- Message goes here -->
                </div>
            </div>
        </div>

        <!-- PayHere JS SDK -->
        <script type="text/javascript" src="https://www.payhere.lk/lib/payhere.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="assets/js/sign-out.js"></script>
        <script src="assets/js/checkout.js"></script>
    </body>
</html>
