<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Skillverse</title>
        <link rel="icon" href="assets/images/logo/blackplanet.png" type="image/png">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
        <link rel="stylesheet" href="assets/css/cart.css"/>
    </head>
    <body onload="loadCart(); updateCartCount(); setBreadcrumb();">
        <!--navbar-->
        <div id="navbar"></div>
        <script>
            fetch('navbar.html')
                    .then(res => res.text())
                    .then(data => {
                        document.getElementById('navbar').innerHTML = data;
                    });
        </script>
        <!--navbar-->

        <!-- Breadcrumb -->
        <div class="container-lg pt-2 mt-4">
            <nav aria-label="breadcrumb" class="mb-3">
                <ol class="breadcrumb" id="breadcrumb-list"></ol>
            </nav>
        </div>
        <!-- Breadcrumb -->

        <!-- Cart Content -->
        <div class="container-xl py-5">
            <h2 class="fw-bold mb-4" style="font-size:2.1rem;">My Cart</h2>
            <div class="row g-4">
                <div class="col-lg-8">
                    <div class="cart-card"></div>
                </div>
                <div class="col-lg-4">
                    <div class="cart-summary">
                        <div class="fw-bold mb-3" style="font-size:1.17em;">Order Summary</div>
                        <div class="d-flex justify-content-between mb-2">
                            <span>Subtotal</span>
                            <span class="fw-bold" id="subtotal-amount">LKR 0.00</span>
                        </div>
                        <div class="d-flex justify-content-between mb-3">
                            <span>Taxes</span>
                            <span class="fw-bold">LKR 0.00</span>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between mb-4">
                            <span class="fw-bold" style="font-size:1.1em;">Total</span>
                            <span class="fw-bold" style="color:#ffd54f; font-size:1.1em;" id="total-amount">LKR 0.00</span>
                        </div>
                        <a href="checkout.html" class="btn btn-primary w-100 btn-checkout mb-3">Proceed to Checkout</a>
                        <a href="home.html" class="btn btn-outline-light w-100 mb-3">Continue Shopping</a>
                        <button class="btn btn-outline-danger w-100 mb-3" id="clear-cart-btn" onclick="clearCart();">Clear Cart</button>
                    </div>
                </div>
            </div>
        </div>

        <!--footer-->
        <div id="footer-placeholder"></div>
        <script>
            fetch('footer.html')
                    .then(res => res.text())
                    .then(data => {
                        document.getElementById('footer-placeholder').innerHTML = data;
                    });
        </script>
        <!--footer-->

        <!--cart-->
        <div id="cart-drawer-placeholder"></div>
        <script>
            fetch('cart-drawer.html')
                    .then(res => res.text())
                    .then(data => {
                        document.getElementById('cart-drawer-placeholder').innerHTML = data;
                    });
        </script>
        <!--cart-->

        <div class="toast-container position-fixed bottom-0 end-0 p-3">
            <div id="cartToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
                <div class="toast-header">
                    <img src="assets/images/logo/whiteplanet.png" class="rounded me-2" style="height: 40px; vertical-align: middle; margin-left: 2px;">
                    <strong class="me-auto">SkillVerse</strong>
                    <small>Now</small>
                    <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
                </div>
                <div class="toast-body" id="toastBody">
                    <!-- Message goes here -->
                </div>
            </div>
        </div>

        <!-- Google Translate script -->
        <div id="google_translate_element" style="display:none;"></div>
        <script type="text/javascript">
            function googleTranslateElementInit() {
                new google.translate.TranslateElement({pageLanguage: 'en', includedLanguages: 'en,si,ta', layout: google.translate.TranslateElement.InlineLayout.SIMPLE}, 'google_translate_element');
            }

            // Language change handler
            function translatePage(lang) {
                if (lang === 'en') {
                    // Reset to English
                    document.cookie = 'googtrans=/en/en;domain=' + window.location.hostname + ';path=/';
                    location.reload();
                    return;
                }
                var code = '/en/' + lang;
                document.cookie = 'googtrans=' + code + ';domain=' + window.location.hostname + ';path=/';
                location.reload();
            }
        </script>
        <script>
            function setBreadcrumb() {
                const ol = document.getElementById("breadcrumb-list");
                const lastCourseId = localStorage.getItem("lastCourseId");
                const lastCourseTitle = localStorage.getItem("lastCourseTitle") || "Course";
                const lastCourseCategory = localStorage.getItem("lastCourseCategory");
                ol.innerHTML = `
        <li class="breadcrumb-item"><a href="home.html" class="text-decoration-none"><i class="ri-home-4-line"></i></a></li>
        <li class="breadcrumb-item"><a href="404.html" class="text-decoration-none">Browse</a></li>
        <li class="breadcrumb-item"><a href="404.html?category=${encodeURIComponent(lastCourseCategory)}" class="text-decoration-none">${lastCourseCategory}</a></li>
        <li class="breadcrumb-item"><a href="course-view.html?id=${lastCourseId}" class="text-decoration-none">${lastCourseTitle}</a></li>
        <li class="breadcrumb-item active aria-current="page"">Cart</li>
        `;
            }
        </script>
        <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
        <script src="assets/js/sign-out.js"></script>
        <script src="assets/js/cart.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <!-- GSAP CDN -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    </body>
</html>
