<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>SkillVerse</title>
        <link rel="icon" href="assets/images/logo/blackplanet.png" type="image/png">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <style>
            /* Spacy animated background */
            body {
                min-height: 100vh;
                background: linear-gradient(135deg, #252250 0%, #6857f3 100%);
                overflow-x: hidden;
                position: relative;
                animation: fadein 1.5s;
            }
            @keyframes fadein {
                from {
                    opacity: 0;
                }
                to   {
                    opacity: 1;
                }
            }
            /* Floating blobs */
            .blob {
                position: absolute;
                border-radius: 50%;
                filter: blur(32px);
                opacity: 0.5;
                pointer-events: none;
            }
            .blob1 {
                width: 240px;
                height: 240px;
                left: -60px;
                top: 20vh;
                background: #a47cf3;
                animation: blobFloat 10s infinite alternate;
            }
            .blob2 {
                width: 160px;
                height: 160px;
                right: -40px;
                top: 60vh;
                background: #53d1fa;
                animation: blobFloat2 14s infinite alternate;
            }
            @keyframes blobFloat {
                to {
                    left: 20vw;
                    top: 15vh;
                    opacity: 0.6;
                }
            }
            @keyframes blobFloat2 {
                to {
                    right: 10vw;
                    top: 50vh;
                    opacity: 0.3;
                }
            }

            .success-card {
                max-width: 410px;
                margin: 8vh auto 0 auto;
                background: rgba(255,255,255,0.95);
                border-radius: 32px;
                box-shadow: 0 4px 32px 2px rgba(100,80,180,0.07);
                padding: 3rem 2rem 2.5rem 2rem;
                text-align: center;
                position: relative;
                z-index: 3;
                animation: dropin 1s;
            }
            @keyframes dropin {
                0% {
                    transform: translateY(-40px) scale(0.95);
                    opacity: 0;
                }
                100% {
                    transform: translateY(0) scale(1);
                    opacity: 1;
                }
            }
            .success-icon {
                font-size: 3.4rem;
                line-height: 1;
                margin-bottom: 1.5rem;
                color: #53d1fa;
                animation: popscale 0.8s cubic-bezier(.45,1.7,.61,.91) 0.3s;
            }
            @keyframes popscale {
                0% {
                    transform: scale(0);
                }
                65% {
                    transform: scale(1.15);
                }
                100% {
                    transform: scale(1);
                }
            }
            .main-message {
                font-size: 2rem;
                font-weight: 600;
                color: #292257;
                letter-spacing: .01em;
                margin-bottom: .6rem;
                animation: textfade .9s .6s both;
            }
            .success-detail {
                color: #555;
                font-size: 1.08rem;
                margin-bottom: 1.7rem;
                animation: textfade 1s 1s both;
            }
            @keyframes textfade {
                from {
                    opacity: 0;
                    transform: translateY(14px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
            .success-btn {
                padding: 0.85em 2em;
                font-size: 1.12rem;
                border-radius: 2em;
                background: linear-gradient(90deg,#6857f3,#53d1fa);
                border: none;
                color: #fff;
                font-weight: 600;
                transition: background 0.25s, box-shadow 0.2s;
                box-shadow: 0 2px 12px 1px rgba(100,80,180,0.12);
            }
            .success-btn:hover {
                background: linear-gradient(90deg,#53d1fa,#6857f3);
                box-shadow: 0 4px 32px 2px rgba(100,80,180,0.17);
            }
            .order-summary {
                font-size: 1.06rem;
                background: #f7f6ff;
                padding: 1em 1.2em;
                border-radius: 1em;
                margin-bottom: 1.2em;
                text-align: left;
                color: #322a66;
            }
            /* Confetti (simple) */
            .confetti {
                position: absolute;
                pointer-events: none;
                left: 0;
                top: 0;
                width: 100vw;
                height: 100vh;
                z-index: 20;
            }
        </style>
    </head>
    <body>
        <div class="blob blob1"></div>
        <div class="blob blob2"></div>

        <canvas id="confetti-canvas" class="confetti"></canvas>

        <div class="success-card shadow-lg">
            <div class="success-icon">
                <!-- SVG check or emoji -->
                <svg width="54" height="54" viewBox="0 0 54 54" fill="none">
                <circle cx="27" cy="27" r="27" fill="#53d1fa" fill-opacity="0.10"/>
                <path d="M38 21.5L24.625 34.875L17 27.25" stroke="#53d1fa" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <div class="main-message">Payment Successful!</div>
            <div class="success-detail">
                Thank you for your purchase. Your order is confirmed and you’ll receive an email with the details shortly.<br>
                <span class="text-success" id="success-countdown"></span>
            </div>
            <div class="order-summary" id="order-summary">
                Order ID: <span id="order-id">Loading...</span><br>
                Amount Paid: <span id="amount-paid">LKR 0.00</span>
            </div>
            <button class="success-btn" onclick="window.location = 'my-learning.html'">Go to My Courses</button>
            <div class="mt-3">
                <a href="home.html" class="text-decoration-underline" style="color:#53d1fa;">Return Home</a>
            </div>
        </div>

        <!-- Optional: Bootstrap JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
        <!-- Simple Confetti Animation -->
        <script>
                // Simple confetti
                const confettiColors = ["#6857f3", "#53d1fa", "#a47cf3", "#fff"];
                const confettiCount = 44;
                function drawConfetti() {
                    const canvas = document.getElementById('confetti-canvas');
                    if (!canvas)
                        return;
                    const ctx = canvas.getContext('2d');
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                    let confetti = [];
                    for (let i = 0; i < confettiCount; i++) {
                        confetti.push({
                            x: Math.random() * canvas.width,
                            y: Math.random() * canvas.height / 2,
                            r: Math.random() * 10 + 6,
                            c: confettiColors[Math.floor(Math.random() * confettiColors.length)],
                            v: Math.random() * 2 + 1,
                            a: Math.random() * 2 * Math.PI
                        });
                    }
                    function animate() {
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        confetti.forEach(f => {
                            ctx.beginPath();
                            ctx.arc(f.x, f.y, f.r, 0, 2 * Math.PI);
                            ctx.fillStyle = f.c;
                            ctx.globalAlpha = 0.7;
                            ctx.fill();
                            ctx.globalAlpha = 1;
                            f.y += f.v;
                            f.x += Math.sin(f.a) * 1.7;
                            f.a += 0.03;
                            if (f.y > canvas.height)
                                f.y = -10;
                        });
                        requestAnimationFrame(animate);
                    }
                    animate();
                }
                window.onload = drawConfetti;
                window.onresize = drawConfetti;
        </script>
        <!-- Order Summary Loader + Countdown -->
        
        <script>
            // Enhanced success page script with multiple data sources
            document.addEventListener("DOMContentLoaded", function () {
                console.log("Success page loaded, fetching order details...");

                // Try multiple methods to get order data
                loadOrderDetails();

                // Start countdown
                updateCountdown();
            });
            
            // Optional: auto-redirect in 10s
            let countdown = 10;
            function updateCountdown() {
                const elem = document.getElementById('success-countdown');
                if (elem) {
                    elem.innerText = `Redirecting to your dashboard in ${countdown} seconds...`;
                }
                if (countdown <= 0) {
                    window.location = "my-learning.html";
                } else {
                    countdown--;
                    setTimeout(updateCountdown, 1000);
                }
            }

            async function loadOrderDetails() {
                let orderData = null;

                // Method 1: Check URL parameters (PayHere return)
                orderData = getOrderFromURL();
                if (orderData.orderId && orderData.amount) {
                    console.log("Using order data from URL parameters");
                    updateOrderDetails(orderData.orderId, orderData.amount);
                    return;
                }

                // Method 2: Check localStorage (recent order backup)
                orderData = getOrderFromStorage();
                if (orderData && orderData.orderId && orderData.amount) {
                    console.log("Using order data from localStorage");
                    updateOrderDetails(orderData.orderId, orderData.amount);
                    return;
                }

                // Method 3: Fetch from backend API
                try {
                    orderData = await fetchLatestOrderFromAPI();
                    if (orderData && orderData.orderId && orderData.amount) {
                        console.log("Using order data from API");
                        updateOrderDetails(orderData.orderId, orderData.amount);
                        return;
                    }
                } catch (error) {
                    console.error("API fetch failed:", error);
                }

                // Fallback: Show error state
                console.warn("Could not load order details from any source");
                handleNoOrderFound();
            }

            function getOrderFromURL() {
                const urlParams = new URLSearchParams(window.location.search);
                return {
                    orderId: urlParams.get('order_id'),
                    amount: urlParams.get('amount') || urlParams.get('payhere_amount'),
                    currency: urlParams.get('currency') || urlParams.get('payhere_currency') || 'LKR'
                };
            }

            function getOrderFromStorage() {
                try {
                    const recentOrder = localStorage.getItem('skillverse_recent_order');
                    if (recentOrder) {
                        const orderData = JSON.parse(recentOrder);
                        const orderTime = new Date(orderData.timestamp);
                        const now = new Date();

                        // Only use if order was within last 10 minutes
                        if (now - orderTime < 10 * 60 * 1000) {
                            return orderData;
                        } else {
                            localStorage.removeItem('skillverse_recent_order');
                        }
                    }
                } catch (error) {
                    console.error("Error reading from localStorage:", error);
                }
                return null;
            }

            async function fetchLatestOrderFromAPI() {
                const response = await fetch('GetLatestOrder', {
                    method: 'GET',
                    credentials: 'include',
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                const data = await response.json();
                console.log("API response:", data);

                if (data.status && data.order) {
                    return {
                        orderId: "#000" + data.order.id,
                        amount: data.order.total,
                        currency: 'LKR'
                    };
                }

                return null;
            }

            function updateOrderDetails(orderId, amount, currency = 'LKR') {
                console.log("Updating UI with:", orderId, amount, currency);

                const orderIdElement = document.getElementById("order-id");
                const amountPaidElement = document.getElementById("amount-paid");

                if (orderIdElement) {
                    orderIdElement.classList.remove('loading');
                    orderIdElement.innerHTML = orderId;
                }

                if (amountPaidElement) {
                    amountPaidElement.classList.remove('loading');

                    // Format amount
                    let formattedAmount;
                    if (typeof amount === 'string' && amount.includes('LKR')) {
                        formattedAmount = amount;
                    } else {
                        const numAmount = parseFloat(amount);
                        formattedAmount = `${currency} ${numAmount.toLocaleString("en-US", {
                            minimumFractionDigits: 2,
                            maximumFractionDigits: 2
                        })}`;
                    }

                    amountPaidElement.innerHTML = formattedAmount;
                }

                // Add success animation
                const orderSummary = document.getElementById("order-summary");
                if (orderSummary) {
                    orderSummary.style.transform = "scale(1.02)";
                    setTimeout(() => {
                        orderSummary.style.transform = "scale(1)";
                    }, 200);
            }
            }

            // Store order data in localStorage when payment is initiated (call this from checkout.js)
            function storeOrderData(orderId, amount, currency = 'LKR') {
                try {
                    const orderData = {
                        orderId: orderId,
                        amount: amount,
                        currency: currency,
                        timestamp: new Date().toISOString()
                    };
                    localStorage.setItem('skillverse_recent_order', JSON.stringify(orderData));
                } catch (e) {
                    console.error("Could not store order data:", e);
            }
            }
        </script>
    </body>
</html>
